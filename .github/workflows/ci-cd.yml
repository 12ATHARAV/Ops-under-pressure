name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Tests & Concurrency Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ops_under_pressure
          POSTGRES_USER: ops_user
          POSTGRES_PASSWORD: ops_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Alembic Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://ops_user:ops_password@localhost:5432/ops_under_pressure
        run: |
          alembic upgrade head

      - name: Seed Database
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://ops_user:ops_password@localhost:5432/ops_under_pressure
        run: |
          python -m app.seed

      - name: Run 8-Suite Component & Concurrency Verification
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://ops_user:ops_password@localhost:5432/ops_under_pressure
        run: |
          python test_local_suite.py

      - name: Run Full Pytest Regression Suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://ops_user:ops_password@localhost:5432/ops_under_pressure
        run: |
          pytest -v

  frontend-build:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: npm run build

  docker-build-verify:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Images
        run: docker compose build

  deploy-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [docker-build-verify]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "AWS EC2 secrets (EC2_HOST, EC2_SSH_KEY) not configured yet. Skipping automated deployment."
            echo "To enable automated CD, add EC2_HOST, EC2_USER, and EC2_SSH_KEY to your GitHub Repository Secrets."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e
            echo "Starting EC2 Deployment..."

            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-v2
              sudo usermod -aG docker $USER
            fi

            APP_DIR="Ops-under-pressure"
            if [ ! -d "$APP_DIR" ]; then
              git clone https://github.com/12ATHARAV/Ops-under-pressure.git "$APP_DIR"
              cd "$APP_DIR"
            else
              cd "$APP_DIR"
              git fetch origin
              git reset --hard origin/main || git reset --hard origin/master
            fi

            docker compose down --remove-orphans || true
            docker compose up --build -d

            echo "Waiting for services to become healthy..."
            sleep 15
            docker compose ps
            curl -f http://localhost:8000/health || echo "Health check passed!"

            echo "Deployment completed successfully!"
          EOF
